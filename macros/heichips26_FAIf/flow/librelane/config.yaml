# LibreLane configuration file

meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

DESIGN_NAME: heichips26_FAIf
VERILOG_FILES: 
  # - dir::../../rtl/*.sv
  # - dir::../../rtl/gen/*.v
  - dir::../../rtl/heichips26_FAIf.sv
  - dir::../../rtl/gen/*.v  
CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 10 # 10ns = 100MHz

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Reduce wasted space
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6

# Absolute die size
FP_SIZING: absolute

# Tiny DEF template
#DIE_AREA: [0, 0, 200, 200]
#FP_DEF_TEMPLATE: dir::heichips26_template_tiny.def

# Small DEF template
DIE_AREA: [0, 0, 500, 200]
# FP_DEF_TEMPLATE: dir::heichips26_template_small.def
FP_DEF_TEMPLATE: dir::heichips26_template_small_analog.def


# Large DEF template
#DIE_AREA: [0, 0, 500, 415]
#FP_DEF_TEMPLATE: dir::heichips26_template_large.def

# Don't use power rings or TopMetal1 layer
PDN_MULTILAYER: false
RT_MAX_LAYER: Metal4
PDN_VERTICAL_LAYER: Metal4
PDN_HORIZONTAL_LAYER: Metal3

# Second supply for the analog macro (3.3 V)
VDD_NETS: [VPWR, VAPWR]
GND_NETS: [VGND, VGND]

# Small vertical macro halo: keeps the bottom row (and its rails) under the macro
FP_MACRO_VERTICAL_HALO: 1
PDN_VERTICAL_HALO: 1


# Keep the resizer off the analog nets
RSZ_DONT_TOUCH_RX: "^analog_"

# Enable for better SystemVerilog support
#USE_SLANG: true

MACROS:
  analogue_interface:
    gds:
      - dir::../../macros/analogue_interface/final/gds/analogue_interface.gds
    lef:
      - dir::../../macros/analogue_interface/final/lef/analogue_interface.lef
    vh:
      - dir::../../macros/analogue_interface/final/vh/analogue_interface.vh
    lib:
      "*":
        - dir::../../macros/analogue_interface/final/lib/analogue_interface.lib
    instances:
      analogue_interface_instance:
        location: [190, 8.82]
        orientation: N
